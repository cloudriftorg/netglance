name: Build & publish FreeBSD pkg repo

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # to push to gh-pages

jobs:
  build-pkgs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # for git describe inside the FreeBSD VM

      # Build the source tarball that the FreeBSD port consumes. We do the
      # frontend build on Linux (faster than inside the BSD VM) and ship the
      # embedded dist/ inside the tarball so the BSD VM only needs Go.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Stage frontend into backend
        run: |
          rm -rf backend/internal/webui/dist
          mkdir -p backend/internal/webui/dist
          cp -R frontend/dist/. backend/internal/webui/dist/

      # Cross-compile the FreeBSD binary on the Linux runner — Go does
      # this natively (modernc.org/sqlite is pure Go). This avoids
      # installing go/git inside the FreeBSD VM and shaves ~10 minutes
      # off CI vs. building inside the VM after a `pkg upgrade -y`.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: backend/go.sum
      - name: Cross-compile FreeBSD binary
        working-directory: backend
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ] && VERSION="0.0.0-dev"
          CGO_ENABLED=0 GOOS=freebsd GOARCH=amd64 \
            go build -trimpath \
              -ldflags="-s -w -X main.version=$VERSION" \
              -o ../netglance-freebsd-amd64 \
              ./cmd/server

      - name: Build .pkg files inside FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        env:
          PKG_SIGN_KEY: ${{ secrets.PKG_SIGN_KEY }}
        with:
          release: "14.1"
          usesh: true
          envs: "PKG_SIGN_KEY GITHUB_REF_NAME"
          copyback: true
          prepare: |
            # Minimal install: arp-scan we re-bundle for the repo, plus
            # bash for opnsense/plugins/Mk scripts. No go (cross-
            # compiled on the runner), no jq (replaced with awk), no
            # gmake (plugins.mk uses bmake), no git (we fetch the
            # opnsense/plugins tarball with the preinstalled `fetch`).
            # Skipping `pkg upgrade -y` saves ~10 minutes; dropping git
            # avoids the pcre2 mismatch that upgrade was working around.
            pkg install -y bash arp-scan
          run: |
            set -eu
            VERSION="${GITHUB_REF_NAME#v}"
            [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ] && VERSION="0.0.0-dev"

            mkdir -p /tmp/pkgroot/usr/local/sbin
            mkdir -p /tmp/pkgroot/usr/local/etc/rc.d
            mkdir -p /tmp/pkgroot/usr/local/etc/netglance
            mkdir -p /tmp/pkgroot/var/db/netglance

            # Binary was cross-compiled on the Linux runner (see step
            # above). vmactions rsyncs the workspace into the VM, so it's
            # already at $GITHUB_WORKSPACE/netglance-freebsd-amd64.
            cp $GITHUB_WORKSPACE/netglance-freebsd-amd64 \
              /tmp/pkgroot/usr/local/sbin/netglance
            chmod +x /tmp/pkgroot/usr/local/sbin/netglance

            sed "s|%%PREFIX%%|/usr/local|g" \
              deploy/freebsd-port/files/netglance.in \
              > /tmp/pkgroot/usr/local/etc/rc.d/netglance
            chmod +x /tmp/pkgroot/usr/local/etc/rc.d/netglance

            mkdir -p /tmp/pkgs

            # Flatten the multi-line pkg-descr into one line. JSON strings
            # don't allow literal newlines and we'll emit JSON for the
            # manifest below — UCL accepts JSON as a strict subset, and
            # using JSON dodges every YAML/UCL ambiguity we hit before
            # (deps block syntax, files block syntax, indentation, etc.).
            NETGLANCE_DESC=$(tr '\n' ' ' < deploy/freebsd-port/pkg-descr | sed 's/  */ /g; s/ $//')
            OSNG_DESC=$(tr '\n' ' ' < deploy/opnsense-plugin/pkg-descr | sed 's/  */ /g; s/ $//')

            # Escape any " or \ in descriptions for safe JSON embedding.
            json_escape() { printf '%s' "$1" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g'; }
            NETGLANCE_DESC_JSON=$(json_escape "$NETGLANCE_DESC")
            OSNG_DESC_JSON=$(json_escape "$OSNG_DESC")

            # Generate the files object for the netglance manifest by
            # walking /tmp/pkgroot. pkg create -M *requires* an explicit
            # files: list — the -r rootdir flag only sets the lookup root,
            # it doesn't auto-discover. Build the JSON object with awk
            # (no jq needed — installing jq used to drag in a pcre2
            # upgrade that broke the VM's preinstalled git).
            FILES_JSON=$(cd /tmp/pkgroot && find . -type f \
              | sed 's|^\./|/|' \
              | awk 'BEGIN{printf "{"} {if(NR>1)printf ","; printf "\"%s\":\"\"",$0} END{printf "}"}')

            cat > /tmp/netglance-manifest <<JSON
            {
              "name": "netglance",
              "version": "$VERSION",
              "origin": "net-mgmt/netglance",
              "categories": ["net-mgmt"],
              "comment": "LAN host discovery and inventory daemon",
              "desc": "$NETGLANCE_DESC_JSON",
              "maintainer": "massimo.schiavo.p@gmail.com",
              "www": "https://github.com/netglance/netglance",
              "prefix": "/usr/local",
              "arch": "FreeBSD:14:amd64",
              "licenselogic": "single",
              "licenses": ["MIT"],
              "deps": {
                "arp-scan": {
                  "origin": "net-mgmt/arp-scan",
                  "version": "*"
                }
              },
              "users": ["netglance"],
              "groups": ["netglance"],
              "directories": {
                "/usr/local/etc/netglance": "y",
                "/var/db/netglance": "y"
              },
              "files": $FILES_JSON,
              "scripts": {
                "post-install": "pw groupadd -n netglance -g 950 2>/dev/null || true\npw useradd -n netglance -u 950 -g netglance -d /var/db/netglance -s /usr/sbin/nologin 2>/dev/null || true\nchown netglance:netglance /var/db/netglance\nchmod 750 /var/db/netglance\n"
              }
            }
            JSON
            echo "─── netglance manifest (head) ───"
            head -50 /tmp/netglance-manifest
            echo "─── /netglance manifest ───"
            pkg create -M /tmp/netglance-manifest -r /tmp/pkgroot -o /tmp/pkgs

            # plugins.mk validates PLUGIN_DEPENDS by querying the local
            # pkg DB, so install the netglance pkg we just built before
            # the plugin build runs. -f forces past arp-scan/user-creation
            # idempotency hiccups.
            pkg add -f /tmp/pkgs/netglance-*.pkg

            # ── os-netglance plugin pkg ─ via opnsense/plugins framework ──
            # Building the plugin pkg by hand left the OPNsense Plugin
            # Manager flagging it "misconfigured" (empty Categories,
            # missing annotations, no MVC files). Use the upstream
            # plugins.mk make-package flow instead — same one official
            # plugins (ntopng, wireguard, ...) go through, so the output
            # has every annotation the firmware expects.
            # Fetch the opnsense/plugins framework as a tarball — avoids
            # needing git inside the VM (its pcre2 dep clashes with the
            # base image's older libpcre2). `fetch` is preinstalled.
            mkdir -p /tmp/opnsense-plugins
            fetch -qo /tmp/plugins.tar.gz \
              https://codeload.github.com/opnsense/plugins/tar.gz/refs/heads/master
            tar -xzf /tmp/plugins.tar.gz -C /tmp/opnsense-plugins --strip-components=1
            mkdir -p /tmp/opnsense-plugins/net/netglance
            cp -R deploy/opnsense-plugin/. /tmp/opnsense-plugins/net/netglance/
            # Inject the rc tag's version (the committed Makefile holds
            # the next-stable version, not the rc).
            sed -i.bak "s/^PLUGIN_VERSION=.*/PLUGIN_VERSION=\t$VERSION/" \
              /tmp/opnsense-plugins/net/netglance/Makefile
            rm -f /tmp/opnsense-plugins/net/netglance/Makefile.bak
            cd /tmp/opnsense-plugins/net/netglance
            # plugins.mk uses BSD-make .include syntax — invoke the
            # platform's bmake (just `make` on FreeBSD), not gmake.
            make package
            cp work/pkg/*.pkg /tmp/pkgs/ 2>/dev/null || cp work/pkg/*.txz /tmp/pkgs/
            cd $GITHUB_WORKSPACE

            # ── Build a signed pkg repo ────────────────────────────────
            mkdir -p /tmp/repo/FreeBSD:14:amd64/All
            cp /tmp/pkgs/*.pkg /tmp/repo/FreeBSD:14:amd64/All/

            # OPNsense's curated pkg repo doesn't carry arp-scan, so a
            # plain `pkg install os-netglance` would fail with "missing
            # dependency: arp-scan". Re-bundle the arp-scan we already
            # installed in `prepare` so our repo can satisfy its own
            # closure without sending the user to a second pkg source.
            pkg create -o /tmp/repo/FreeBSD:14:amd64/All -n arp-scan

            if [ -n "${PKG_SIGN_KEY:-}" ]; then
              echo "$PKG_SIGN_KEY" > /tmp/repo.key
              chmod 600 /tmp/repo.key
              pkg repo /tmp/repo/FreeBSD:14:amd64 /tmp/repo.key
              # Publish the public key alongside the metadata
              openssl rsa -in /tmp/repo.key -pubout > /tmp/repo/repo.pub 2>/dev/null
              rm -f /tmp/repo.key
            else
              echo "WARNING: PKG_SIGN_KEY secret is not set — building unsigned repo."
              pkg repo /tmp/repo/FreeBSD:14:amd64
            fi

            # Drop a ready-to-fetch repo config alongside the metadata so
            # users can `fetch -o /usr/local/etc/pkg/repos/netglance.conf
            # https://netglance.github.io/netglance/netglance.conf`
            # instead of crafting the file locally — friendlier than a
            # heredoc that breaks under csh.
            cat > /tmp/repo/netglance.conf <<CONF
            netglance: {
              url: "https://netglance.github.io/netglance/\${ABI}",
              signature_type: "none",
              enabled: yes
            }
            CONF

            # Copy the built repo into the workspace so the host job can
            # pick it up after the VM exits (vmactions copyback transfers
            # the workspace, not /tmp).
            mkdir -p $GITHUB_WORKSPACE/pkg-repo
            cp -R /tmp/repo/. $GITHUB_WORKSPACE/pkg-repo/

      # Skipped: actions/upload-artifact rejects ':' in paths
      # (https://github.com/actions/upload-artifact/issues/325) and the
      # repo layout requires FreeBSD:14:amd64/ verbatim. Deploy directly
      # to gh-pages instead — that's the canonical destination anyway.

      - name: Deploy to gh-pages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pkg-repo
          keep_files: true
          enable_jekyll: false
