# Pulls the published image from GHCR. Pin a specific tag in production
# (e.g. v0.1.0) and bump deliberately; `latest` is fine for homelab.
#
# For local development against your code, run `make docker` and swap
# the image to `netglance:dev`.
#
# `network_mode: host` is required so the scanner sees the host's network
# stack (LAN subnets, /proc/net/arp). Without it the container only sees
# the Docker bridge.

services:
  netglance:
    image: ghcr.io/massimoschiavop/netglance:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - netglance_data:/data

volumes:
  netglance_data:
