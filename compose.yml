# Production / homelab compose. Pulls the published image from GHCR.
# Pin a specific tag (e.g. v0.1.0) for stability; `latest` is fine for homelab.
#
# `network_mode: host` is mandatory: arp-scan needs the host's real network
# stack to send raw ARP requests. With a Docker bridge it would only see
# the bridge subnet, not your LAN/VLANs.
#
# The app listens on port 8473 by default. Override with NETGLANCE_BIND=:PORT.
#
# For local development on macOS use `make local` (see compose.dev.yml).

services:
  netglance:
    image: ghcr.io/massimoschiavop/netglance:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - netglance_data:/data

volumes:
  netglance_data:
